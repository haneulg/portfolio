<!doctype html>
<html>

<head>
	<title>AMUSE</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<!--DM Sans_font1-->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
		rel="stylesheet">
	<!-- favicon -->
	<link rel="shortcut icon" href="images/favicon.svg" type="image/x-icon">
	<style>
		* {
			margin: 0;
			padding: 0;
		}

		a {
			text-decoration: none;
			color: inherit;
		}

		img {
			display: block;

		}

		#top {
			max-width: 1500px;
			margin: 0 auto;
		}

		body {
			font-family: 'DM Sans', sans-serif;
			background-color: #FFF9FD;

		}

		.fixed_box {
			position: fixed;
			bottom: 40px;
			right: 30px;
			width: 40px;
		}

		#top img {
			width: 100%;
			margin: 50px auto;
			border: #222222 1px solid;
		}

		.home_btn,
		.top_btn {
			display: inline-block;
			width: 57px;
			line-height: 57px;
			background-color: #222222;
			text-align: center;
			border-radius: 50%;
			margin-bottom: 5px;
			color: #fff;
			transition: all 0.5s;
			font-size: 15px;
			font-weight: 700;
		}

		.fixed_box a:hover {
			background-color: #F54D83;
		}

		.View_btn {
			position: fixed;
			bottom: 60px;
			left: 50%;
			transform: translateX(-50%);
			background-color: #222222;
			color: #fff;
			text-align: center;
			font-weight: 700;
			padding: 15px 40px;
			border-radius: 99px;
			transition: all 0.5s;
			background-color: #F54D83;
			animation: colorBlink 1.8s ease-in-out infinite;
		}

	
		@keyframes colorBlink {

			0%,
			100% {
				background-color: #F54D83;
			}

			50% {
				background-color: #222222;
			}
		}
	</style>
</head>

<body>
	<div id="top">
		<img src="./images/amuse.jpg" alt="bx이미지"><!--가이드 이미지 경로 지정하기-->
	</div>
	<div class="fixed_box">
		<a href="#top" class="top_btn"><!--href부분은 이미지를 감싼 div에 있는 id이름과 동일하게 설정.-->
			TOP
		</a>
		<a href="./index.html" target="_blank" class="home_btn">
			Home
		</a>
	</div>

	<div class="View_Prototype">
		<a href="https://www.figma.com/proto/cYEQcgNMDYamvb7hTQSZqw" class="View_btn"
			target="_blank"><!--href부분은 이미지를 감싼 div에 있는 id이름과 동일하게 설정.-->
			VIEW PROTOTYPE
		</a>
	</div>


	<!--이동시 부드럽게 이동시키기 위해 추가한 구문 시작. script쪽 전부 삭제가능.-->
	<script src="https://code.jquery.com/jquery-1.12.4.min.js"
		integrity="sha256-ZosEbRLbNQzLpnKIkEdrPv7lOy9C27hHQ+Xp8a4MxAQ=" crossorigin="anonymous"></script>
	<script>
		$(function () {
			$('a[href*="#"]:not([href="#"])').click(function () {
				if (location.pathname.replace(/^\//, '') == this.pathname.replace(/^\//, '') && location.hostname == this.hostname) {
					var target = $(this.hash);
					target = target.length ? target : $('[name=' + this.hash.slice(1) + ']');
					if (target.length) {
						$('html, body').animate({
							scrollTop: target.offset().top
						}, 500);//움직이는 시간 조정
						return false;
					}
				}
			});
		});
	</script>
	<!--이동시 부드럽게 이동시키기 위해 추가한 구문 끝. 삭제가능.-->
</body>

</html>
